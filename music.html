<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémen Official Website</title>
    <script
      src="https://kit.fontawesome.com/f175821506.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="icon"
      type="image/png"
      href="assets/Images/Pokémen/favicon.png"
    />
    <link rel="stylesheet" href="CSS/default-style.css" />
    <link rel="stylesheet" href="CSS/music-style.css" />
    <link rel="stylesheet" href="CSS/font.css" />
  </head>
  <body>
    <div id="sideBarDiv">
      <div id="logoImageDiv">
        <a href="index.html">
          <img
            src="assets/Images/Pokémen/Pokémen Official Logo transparent.png"
            alt="Pokémen Logo"
            id="logoImage"
          />
        </a>
      </div>
      <div id="imageIconDiv">
        <div id="galleryDiv" class="sideBarBtnDiv">
          <a href="gallery.html">
            <i class="fa-solid fa-image"></i>
            <p>Gallery</p>
          </a>
        </div>
        <div id="shopDiv" class="sideBarBtnDiv">
          <a href="shop.html">
            <i class="fa-solid fa-shop"></i>
            <p>Shop</p>
          </a>
        </div>
        <div id="musicDiv" class="sideBarBtnDiv">
          <a href="music.html">
            <i class="fa-solid fa-headphones"></i>
            <p>Music</p>
          </a>
        </div>
        <div id="newReleaseDiv" class="sideBarBtnDiv">
          <a href="latestRelease.html">
            <img
              id="newIcon"
              src="assets/Images/Icons/New icon.png"
              alt="New icon"
            />
            <p>New</p>
          </a>
        </div>
        <div id="aboutDiv" class="sideBarBtnDiv">
          <a href="about.html">
            <i class="fa-solid fa-circle-info"></i>
            <p>About</p>
          </a>
        </div>
      </div>
    </div>

    <div id="rightSideDiv">
      <div id="headerDiv">
        <header>
          <div id="searchBarDiv">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
            <input type="text" id="searchBar" placeholder="Search" />
          </div>
          <div>
            <div id="hamburgerMenuDiv">
              <i class="fa-solid fa-bars"> </i>
              <div id="menuSideBarDiv">
                <ul>
                  <li class="hambMenuOptions">
                    <a href="about.html">About Us</a>
                  </li>
                  <li class="hambMenuOptions"><a href="index.html">Home</a></li>
                </ul>
              </div>
            </div>
          </div>
        </header>
      </div>
      <main>
        <img
          id="banner"
          src="assets/Images/Pokémen/banner.png"
          alt="Pokémen Banner"
        />

        <div id="pageBody">
          <div id="musicPageDiv">
            <h1>Music:</h1>
            <div class="musicDiv">
              <h3>Pokémen Official Theme Song</h3>
              <img
                class="musicImage"
                src="assets/Images/Pokémen/theme song image.png"
                alt=""
              />

              <audio
                id="themeSong"
                controls
                controlsList="nodownload noplaybackrate"
                style="width: 90%"
              >
                <source
                  src="assets/audios/Pokemen-Official-Theme-Song.mpeg"
                  type="audio/mpeg"
                />
                Your browser does not support the audio element.
              </audio>
            </div>
          </div>
        </div>
      </main>
      <footer>
        <div id="footerDiv">
          <div id="footerLeftDiv">
            <ul>
              <li>Author: Issac Yu</li>
              <li>
                Contact us:
                <a
                  href="mailto:PokemenLimitedUnlimited@gmail.com"
                  id="footerEmail"
                  >PokemenLimitedUnlimited@gmail.com</a
                >
              </li>
              <li>
                &copy; 2026 Copyright reserved to Pokémen Limited Unlimited
              </li>
            </ul>
            <div id="footerImgDivCont">
              <div class="footerImgDiv" id="footerLogoDiv">
                <img
                  src="assets/Images/Pokémen/Pokémen Official Logo transparent.png"
                  alt="Pokémen Logo"
                />
              </div>
              <div class="footerImgDiv" id="footerFaviconDiv">
                <img
                  id="footerFavicon"
                  src="assets/Images/Pokémen/favicon transparent.png"
                  alt="Pokémen Logo"
                />
              </div>
            </div>
          </div>
          <div id="footerRightDiv">
            <div id="phoneNoLabel">
              <p>Phone number:</p>
              <a href="tel: +44 5089 436914" id="footerPhoneNo"
                >+44 5089 436914</a
              >
            </div>

            <!--🔁 How to reverse it
                    To decrypt:
                    Take the number
                    Repeatedly divide by 95
                    Extract remainders
                    Convert each remainder back to ASCII
          
          This yields the original characters exactly.-->
            <br />
            <div id="footerSMDiv">
              <a href="https://www.instagram.com" target="_blank"
                ><i class="fa-brands fa-instagram"></i
              ></a>
              <a href="https://www.facebook.com" target="_blank"
                ><i class="fa-brands fa-facebook"></i
              ></a>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script src="Javascript/index.js"></script>
  </body>
</html>
